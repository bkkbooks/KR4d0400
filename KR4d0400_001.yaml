body:
  text: 西湖百詠卷上宋董嗣杲撰明陳贄和豐樂樓在湧金門外舊為豐豫門政和七年於湖堂右以衆樂亭舊基建樓扁聳翠建炎後改今名乾淳間設法酤酒繼有撓政者罷之淳祐九年改建官為扄鑰城之西有四門曰錢湖曰清波曰錢塘出此三門皆不見湖獨湧金門正與湖水相對建樓掩之關閉風水古傳樓未建時山水或漂城居鶯花簫鼓綺羅叢人在熙和境界中海㝢三登歌化日湖山一覽醉春風水搖層棟青紅濕雲鎖危梯粉黛空十里掌平都掩盡有誰曽紀建樓功和韻萬條垂栁百花叢樓外湖山一望中人醉三春羅綺月簾開四季管絃風當時傑構基猶在昔日繁華事已空惆悵文山生恨晚虞淵取日竟無功湧金池在湧金門裏錢氏書三字刻石其傍云清泰三年丙申之嵗建午之月特開此池楊蟠詩云湧金春色晚吹落碧桃花一片何人得流經十萬家一道香溝壓郭西粉墻低護石階危短碑數尺鐫何字清泰三年鑿此池橋市浣衣無空處廟門賣卜有靈時碧桃自趂東流水暗老春光水不知和韻一泓碧甃郭門西砌石年深覺半危長見莓苔封斷碣暗添湖水滿方池魚吞片片花浮處人玩娟娟月印時昔日楊蟠詩句好只留何字與人知環碧園在豐樂樓北栁洲之側恭聖仁烈楊太后宅園繞舍晴波聚釣仙五龍祠畔栁洲前清虛不類侯家屋輪奐曾資母后錢三面軒窗秋水觀四時簫鼓夕陽船攬將山北山南翠獨有黃昏得景全和韻來逰此境似神仙緑水青山繞檻前盛飾名園鄰寶地豈論內帑費金錢輪蹄日日看花侣絲竹時時載酒船湖上平章真誤國可憐斯圃亦難全玉蓮堂在湧金門城北舊在郡治教場之南堂瞰竹園山下池水淳祐九年與竹山閣同建景定三年移建於此扁一清繼以堂外多種白蓮復换揭玉蓮舊賜扁仙根曾就華峰移净引湘波出浴妃龍護先皇三字在燕居舊尹一清非風簷搖影涼姿媚月檻迷香冷艷肥平展水天菱唱逺竹山蒼翠自成圍和韻玉井誰將仙種移依稀月下覩羣妃行來白鷺渾難認看似瓊花却又非擘破秋房香更嫩取將雪藕脆還肥髙堂對此真堪賞何用尊前粉黛圍玉壺園在錢塘門外菩提寺西東坡詠南漪堂杜鵑花即此也紹興間劉鄜王建園玉壺軒歷年尚存淳祐中别建四面堂景定間改建𨽻內司扁明秀繼撥賜慈元姪為府續後歸慈元殿莫問南漪與玉壺杜鵑還更試花無坡仙一顧吟空老地主頻更景不殊船出斷橋春溆逺鐘傳蕭寺晚樓孤山明水秀軒扉敞落日漁歌過裏湖和韻誰創芳園號玉壺杭人曾識此名無雖云景物如先美堪歎韶華與昔殊嶽穆墓前雙樹古逋仙祠畔一岑孤西湖因得東坡重未必東坡戀此湖先得樓在錢塘門西即錢塘正庫酒樓也咸淳中州里以三篆字揭之㶑灧澄波漾彩椽栁絲晴絆俊逰鞭傍湖莫厭官樓水得月無如此地先迎榜書生空絳帳抱琴才子沃金船壺天蕭爽人人醉雪色屏風畫謫仙和韻朱甍畫棟碧油椽馬上王孫指玉鞭白晝逈涵波影靜清宵最得月華先倚䦨堪弄桓伊笛載酒還來賀監船更有梅花便此景一聨香影屬逋仙古栁林在錢塘正庫西大昭慶寺東北抵楊和王雲洞園幾眠幾醒幾清明萬態風流學老成古翠碧連雲洞杳夕陽西捲射場平絮團破徑應迷蝶枝壓荒墻不露鶯如此多栽堪卜隱苦無十畝秫田耕和韻一抹梢頭夕照明春光老盡緑隂成風流張緒今安在寂寞章臺恨未平飛絮有時迷舞蝶深林何處覓啼鶯老夫亦有陶公興來此閒吟為息耕雲洞園在昭慶寺北馬軍教場後紹興末楊和王建園擁土為洞塗門以雲有堂曰萬景天全亭曰紫翠間臺榭扁額皆清麗今花栁參差中有婦人墓擁湖營圃藉元勳景色天然曲折分水脉窨花通活港洞基壘石走空雲千間大厦歸春夢一撮危亭納夕曛扁畫自懸碑自壓當年何事立孤墳和韻園中殘碣紀先勳藥圃蔬畦次第分竹下流泉宵漾月林間幽洞曉生雲尋芳逰客醉春日弔古詩翁詠夕曛野鳥如歌又如怨名花零落美人墳霍山祠在溜水橋西霍山廣惠廟長慶寺僧主香火神姓張名渤血食廣德軍祠山纍封至真君乾道中創行祠於此霍家山下敞行宫溜水橋西透鼓鐘古迹建平遺烈在春風廣惠厯朝封露臺獻社呈蒼馬隂壁飛旌繪赤龍蟻聚乞靈人散後雲街雨陌撼濤松和韻祠山豁處有行宫此處常聞朝暮鐘曾覽搜神舊時記誰知廣惠纍朝封案前素供盤無豕身上朱袍繡作龍要識香燈傳巳久廟前千尺覆喬松湧泉在霍山祠西清心院門相對有泉從石罅湧出思陵遣使汲泉瀹茶泉自石龍口細噴入池池有小亭覆之今亭傍為化場山腰溜脉出遙峰隔斷西湖翠幾重疊甃漫依僧剎久煎茶曽入翰林供亭心覆雨塗丹鳯石口噓雲噴玉龍何日星馳天使絶不知誰利涅槃宗和韻不知源出自何峰甃石為池苔蘚重汲注僧庖青竹引取烹御茗翠甌供亭中坐聽聲湔玉烟際流來勢走龍汨汨泠泠落溪澗逺隨江漢去朝宗東西馬塍在溜水橋北羊角埂是也河界東西土脉宜栽花卉園人工於種接仰此為業間有園亭不過養種西塍有土神廟額扁作馬城土塍聚落界西東業在澆畦奪化工接死作生滋夜雨變紅為白借春風幾家衣食花姿異兩岸園池地勢同病叟扶鋤鋤晚照前身莫是槖駝翁和韻馬塍西接馬塍東栽植園人技甚工幾陳亷纎紅杏雨數畨淡蕩碧桃風馨香色色花開别紅紫般般種不同他日扶笻來飽玩誰携春酒勸吟翁石函橋在水磨頭樂天湖石記云錢塘湖一名上湖周回三十里北有石函南有筧凡放水溉田每減一寸可溉田十五餘頃此州春多雨夏秋多旱若蓄泄及時瀕湖千餘頃田無凶年矣橋下鑿斗門字尚存函開函閉管年豐白傅能方夏禹功湖石記埋泥蘚裏斗門字蝕水花中犁平阡陌猶春雨船載笙歌自晚風遍倚暮䦨懷古往月明無奈瀑聲空和韻蓄水溉田期嵗豐樂天為郡豈無功橋名舊揭髙牌上湖記今存斷碣中人玩石函苔蘚刻舟移湖曲芰荷風香山歸去俄千載姓字長留事蹟空孤山路在石函橋西南由德生堂過斷橋至孤山出西林橋此堤是也樂天詩云誰開湖寺西南路草緑裙腰一道斜咸淳間郡守於隄上創亭三翠微四絶載蓬瀛栁引逰人入畫屏詩借樂天傳得久山因和靖隱來靈半空梁駕橋䦨赤一道腰分草界青粧㸃風光如此盛藕花香裏又三亭和韻老逋元不慕登瀛屋外雲山結翠屏斜過斷橋苔暈合慣曽迎客鶴心靈林花片片風前落徑草茸茸雨後青說與携壺逰賞客不妨三處憩幽亭德生堂在孤山路口即舊放生池亭州家𣪚聖節于此慶元四年又建别立碑亭其文有曰烏獸魚鱉咸若商歷以興夏事誤作商用士論非之淳祐八年重建御書德生堂泳飛亭二扁瑶臺瑞滿玉皇家澤溥山巔與水涯魚躍鳶飛函德意天長地久演年華金搖巨扁雙龍護翠掩髙碑一字差須信石頑能萬古老龜無語問鶯花和韻放生池本為官家聖主仁恩遍海涯溥使含靈䝉帝澤盡教異域慕中華節逢天夀咸稱賀文粲星光未必差遙想當年公宴畢醉斜烏帽插金花總宜園在德生堂西張內侍園摘東坡詩淡粧濃抹總相宜二字御書堂扁望極湖山變幻竒萬千光景自紛披妙分西子爭妍態絶想東坡得句時桞徑曲埋兜率寺花隂直接放生池內官愛展亭臺去盡付年華與酒巵和韻湖山姿態四時竒吟玩閒將鶴氅披想見東坡題句日正如西子靚粧時香風蝶繞荼䕷架晴日魚翻菡蓞池園號總宜髙揭扁不妨來此醉霞巵斷橋在總宜園西唐張祜孤山詩云斷橋荒蘚合空院落花深或謂段家橋非咸淳中展建繡轂青驄驟晚風栁絲翠裊石闌紅彩篙刺水停飛鷁華表侵雲截卧虹杖屨誰歸瀛嶼去笙歌自補玉壺空重招張祜商新詠不與當時蘚合同和韻拂橋裊娜緑楊風曲曲雕闌映水紅逰客過時徐鞚馬微波映處儼垂虹清新張祜詩還在寂寞林逋宅已空景物不殊人事改落花啼鳥古今同大佛頭在石函橋西俗呼西石頭秦始皇東巡浮海纜船於此宣和中僧思淨即喻彌陀就石刻佛半身舊傳西湖通海東至沙河塘南向一帶皆江也不是金塗丈六仙莊嚴法界想西天自因僧淨鐫空像誰說秦皇纜海船全體未知何日現半生且坐此山禪石頭照水無塵土飽聽鐘聲雜管絃和韻形似西來印度仙半身長映水中天誰令巧匠來鐫石浪說秦王此纜船日炙雨淋遺幻體天荒地老坐枯禪曽移畫舫隄邉泊緑綺閒調月下絃葛嶺在大佛頭西葛仙翁往來鍊丹之地今兩岸多園館間有僧廬白雲幾疊翠嵐重往往踈鐘出梵宫石骨誰人鐫佛像嶺頭何處覔仙翁樓臺水月丹青地簾幕鶯花錦繡叢逰子莫支蒼竹去風雷容易起虛空和韻嶺頭雲氣起重重仙館參差映佛宫誤國曽居前代相煉丹那得舊時翁當初占斷湖山景今日俱成瓦礫叢野老扶笻來弔古薰天富貴總成空保叔塔在巨石山上又名石甑山郡國志云上有七層古塔開寶中錢氏建寺咸平中土僧永保入市募修當坊俗人呼為師叔以此名保叔塔方輿勝覽載保所塔非治平中改崇夀額僧徒専以年建預修冥㑹普結衆緣咸平曽有募緣僧遍走街坊負叔稱定力一堅無外想窣波七級可中興愚夫春日燒冥闕道者昏時炙梵燈祗怪青龍行雨過煙雲遍護最髙層和韻保叔由來苦行僧募緣成塔世咸稱只因南渡人煙衆遂使西來教法興嘹亮笙歌諸處舫周圍星斗半空燈昔年我亦閒登覽直上青雲第一層巾子山在保叔塔西金輪寺後傅牧西湖勝跡事實云形如巾幘和靖詩云巾子山頭烏桕樹清霜未落葉先紅岌嶪山形醜莫收傍湖獨整傲春秋幾株烏桕無根在一幅華陽有樣留寒日霜乾還掠額曉天嵐重且遮頭東籬漉酒人知得醒立風前不可求和韻山頂雨餘雲氣收形如巾幘幾經秋初疑元亮當年造又似林宗此日留最喜花枝紅插鬢還愁雪片白盈頭華陽欲製因無樣觀此何須别去求水月園在保叔塔南紹興間楊和王建園御扁水月阜陵朝撥賜孠秀王園門當路掩清華喬木靈根裹翠霞地擁樓臺齊葛嶺天分香影傍林家中興勳將曽營業外邸王孫且看花月色水光三十里何人來此泛仙槎和韻夜愛波光滉月華朝看水底漾鮮霞由來堪作神仙宅誰料都歸富貴家萬斛秋香飄桂子幾枝寒影入蘋花良宵一舸湖心泛絶勝當年博望槎水仙廟在水月園西廟創梁大同年間號錢塘湖龍君廟錢氏繼請額穹碑尚存乾道中重建寶慶間郡守别建蘇隄上乃謂舊廟有視湖邈焉牽連遷就之說梁大同時今幾傳矣雲翹雨佩有遺仙香火寧隨世道遷廟始大同年紀著額頒乾化敕碑鐫鳳閒露輦荒瑶草龍濕秋衣翦玉蓮隄上創新誰述記却無門外一泓泉和韻龍君即是水祠仙祠建梁朝已再遷華扁髙懸神號在蘚碑猶有舊文鐫粉垣翠覆千竿竹碧沼紅舒萬朵蓮時見乞靈來往客採將蘋藻薦清泉寒泉與水仙廟相對東坡詩云不然配食水仙王一盞寒泉薦秋菊謂和靖也舊名薦菊井上有亭咸淳中增建重揭寒泉二字照膽寒泓覆有亭此泉曾入老坡評八詩最得吟梅苦一盞能消薦菊清不拜韜光徴士詔却傳配食水仙名銀床響絶無人汲墓在孤山木自榮和韻誰於井上覆紅亭泉味坡仙昔見評一盞醉魂傾即醒半甌詩骨沁來清想應和靖曾親汲肯讓參寥獨擅名取去禁中煎御茗井神因此亦光榮參寥泉在上智果佛殿後東坡在黃州夢與參寥子道潜賦詩覺而記兩句云寒食清明都過了石泉槐火一時新後七年守杭參寥住智果寺有泉宜茶寒食日泛湖訪之忽憶舊夢因以參寥名泉十六客分韻坡得心字詩刻及題梁嵗月墨跡至今尚存湖曲春風正禁煙試茶味此石間泉坡仙忽憶黃州夢濳老初拈智果禪幾客醉逰三月裏一聨詩兆七年前題梁妙墨如新染合與雲崖淺井傳和韻正當榆栁換新煙試茗還斟石罅泉坡老已符槐火夢參寥只話葛藤禪嵗時曽紀危梁上寒甃今存古殿前六一後人偏愛慕此名宜與並流傳葛公雙井在夀星寺南相傳葛仙翁煉丹于此井有雙口有石函沉浸井底居人飲此病莫不愈天竺又有煉丹井仙翁洗藥傍西湖脉與靈山碧溜俱泉迸一枝源更異甃分雙眼味何殊石函霞湧沉鉛汞井屋風清轉轆轤日日汲花朝復暮當方曾說病人無和韻仙瓢不汲麗人湖别引岩泉孰興俱堪愛靈源流更别取煎春茗味猶殊一爐晝夜烹離坎雙甃晨昏響轆轤我願居民同飲此更令痾瘵盡皆無江湖偉觀在夀星寺最髙處元名觀臺淳祐十年改建其上更創兩亭直至山椒東坡祠在觀之北倚空窗户不曽扄兩眼風煙障翠屏西子艷分晴雨倦伍胥魂激浪濤腥鼓簫咽晚難無酒花栁爭春别有亭恨掩四時歌舞去古祠寒玉幾竿青和韻層闌吟倚豁靈扄萬疊雲山總畫屏竺岫隔湖舒鳳翼胥濤捲雪帶龍腥嘯歌風月無他處厯覽乾坤有此亭欲唤坡仙同醉酒飛來白鶴海天青此君軒在夀星寺西廊僧房中窗外多竹此扁尚是故物寺門坡下又有亭名一擊軒基不得而考坡詩云一舸鴟夷江海去尚餘君子六千人瀟灑幽扉掩碧叢塵昏題扁想坡翁六千君子寒光落十二䦨干晚色空僧指舊基埋積雨鳥翻新籜起枯風蒼凉不障層坡峻一擊亭閒夕照中和韻雨後移來嶰谷叢幾竿瀟灑對禪翁王猷徑造狂招誚坡老留題跡巳空凉影玲瓏搖夜月寒聲蕭瑟起秋風此君節操何從見都在三冬氷雪中杯泉在夀星寺法堂東廊下坡詩云石眼杯泉舉世無要知杯渡是凡夫可憐狡獪維摩老戲取江湖入鉢盂古甃澄泓照膽清畫龍壁暗挂瓢輕汲來不療相如渴掬處難供太白傾傍屋四圍埋石色侵山一溜走溪聲鉢盂可攬江湖濶參取詩禪放眼明和韻石眼濳流一掬清山瓢擕處往來輕吟消酒渴瓊杯潄凉沁詩脾翠杓傾瑩甚淺浮青玉色泠然微韻緑琴聲吟翁夜半思煎茗呼取蒼頭汲月明初陽臺在寶雲山上葛仙翁登此吸日精月華山下産茶今臺在集芳園東寶山山頂結芙蓉方士凌虛幾御風日月光華含吐異雲萍踪跡往來空石盤草子粘深碧土級苔花剝碎紅舍側又將精舍展蓬瀛有路直能通和韻臺前山列翠芙蓉仙侣簫吹鶴背風每吸霞光餐皓氣擬乘颷馭遡遙空年來漸覺雙瞳碧老去長看兩臉紅九轉丹成即輕舉浮丘已有信音通孤山在西湖中孤山路西建炎前多有民屋間以四菴院山背皆花圃及塜隧山之東為林和靖隱廬就葬其下紹興中建延祥觀奉四聖香火獨留和靖一墓民屋庵院悉徙山北觀東為園纍朝臨幸寶祐二年分地之半建西太乙宫陳朝柏在和靖墓南縹眇蓬萊擁翠寒百年營取屋千間黃庭殿矗煙霞老瀛嶼堂幽日月閒水泛花隂藏輦路墻分栁色護仙關林家梅塜陳家柏萬古流芳鎮此山和韻碧嵐蒼靄晝生寒蓮宇琳宫紫翠間坡老詩招僧入社逋仙心與鶴同閒深深花塢留春住寂寂松扉帶月關雪裏梅開千百樹逰人笑指玉為山和靖先生墓在孤山東北隅錢塘隱士林逋字君復童鶴自隨結廬于此纍詔不起賜號和靖處士天聖六年卒諡和靖先生葬所居後紹興中建御園有詔勿遷此墓詔㫖天頒起卧龍首丘甘老水雲東一聨香影孤山月兩架茅茨萬古風有鶴有童家事足無妻無子世緣空清標卓絶何人繼表表仙宫壠樹中和韻古松偃蹇若虬龍緑草荒墳嶽廟東北闕幾回徴隱逸西湖千載著清風一聲老鶴歸何處千樹寒梅盡已空近日杭人誰好事墓碑扶起棘榛中陳朝柏在孤山東陳天嘉二年嘗植二柏其一為人所薪山下老人云兒時已見其枯矣然堅悍如金石愈於未枯者坡詩云雙幹一先神物化九朝三見太平年阜陵書此詩刻石枯株獨夀憶雙棲誰想天嘉蓊鬱時坡老詩成無繼筆阜陵書此有遺碑日搖槎影龍蛇斷雪綴花痕鳥雀疑化日可期人莫訝柏堂不復辨荒基和韻喬枝曾見鶴來棲霜雪難侵嵗暮時鐵幹共稱陳氏物坡詩猶刻宋朝碑人於得失何須較物有榮枯詎足疑靖節祠堂無復在樹傍或可訪遺基瑪瑙坡在孤山東地有碎石如瑪瑙色樹叢水坑甚深今傍路尚存兩大頑石支徑逶迤混碧苔樹根積水沒蒿萊兩坡截路棊分處何日經人斧鑿來誰說異光迷草野要知遺蹟等塵埃孤山瓦礫曾聞道寄語貪夫莫狼猜和韻雨晴行徑積莓苔錦石雖存翳草萊莫作寶看濳鑿去聊供珍玩獨尋來正當湖曲孤山路不受人間半㸃埃能視黃金如土苴物情真贋莫深猜金沙井在孤山前樂天嘗酌此泉謂其甘美可愛視井傍沙光粲有金星寶祐初井前重建墨溱堂御扁德馨沙漾金星湧活泉虛堂龍染德馨懸朱繩汲冷梅林外翠甃圍凉桂洞前石鼎煮茶非異事井䦨鐫字是何年西南雲擁仙人屋品酌今誰想樂天和韻金沙粲粲映清泉絲綆嘗將碧甕懸㪺灌嘉蔬流竹下汲煎芳茗傍花前不因白傅留題品那得皇家紀嵗年堪笑尋芳往來者有人坐此欲觀天六一泉在孤山西歐陽文忠公將老自號六一居士杭僧惠勤文而能詩出公門下東坡倅杭時嘗因公所囑到官三日訪之明年文忠薨坡哭於勤舍坡離杭十八年重來守杭則勤巳示寂堂後有泉因推本其意名之泉銘在亭上坡於泉後鑿石為室名東坡庵一别孤山十八年重來忍見講堂泉當時同出師門下今日多傷井屋前取重歐公名有自肯教勤老跡空傳此銘此意流千古鑿石為庵不可眠和韻同門曾記哭師年今日愁嘗舍後泉泉脉濳流蒼石罅淚痕猶漬碧崖前心傷勤老歸何處名與文忠喜共傳白髮漁翁知舊事滄浪歌罷對鷗眠西林橋在孤山西即古之西村喚渡處水竹雲山拱畫圖因懷喚渡想東都雨餘晴蝀銜西照風遏春船入裏湖闌曲祗供逰子憑林間今有野人無隔墻莫是神仙宅紅白梅花五百株和韻詩難題詠畫難圖盡說錢塘勝汴都闌擁狻猊髙映水橋環螮蝀近臨湖東風客每携壺過落日人還喚渡無最是春來尤可玩桃花千樹栁千株鳥窠在定業院後唐元和間建鳥窠禪師開山師名圓修富陽人代宗朝逰長安遇國一禪師得法而歸棲止此山長松結蓋鵲巢于側經四十秋樂天守杭入山禮謁太和七年示寂後人發塔惟見銘志松頂巢成亦甚危元和禪此太和歸比丘隨處心傳異刺史逰山禮謁稀銘志土侵無幾字塔亭雨壞有孤扉一空四十年間夢定業門前鵲自飛和韻危處無虞平處危松顛巢與鶴同歸僧流行比圓修少郡守賢如白傅稀枝上看看成佛果林間寂寂閉禪扉相依尚有當年鵲月下還來繞樹飛樂天竹閣在廣化院樂天守杭日建紹興中寺徙今處重建竹閣有鄭清之記樂天詩云晚坐松簷下宵眠竹閣間此君玉立此樓空不復幽眠想白公百尺有簷侵碧落千竿無語足清風闌尖亭影流漁屋龕面祠香托佛宫石琢端平丞相記都歸寶慶守臣功和韻竹間髙閣勢凌空後世人稱白傅公一榻清虛延夜月四簷蕭瑟韻秋風笙簫時過逰人舫鐘磬遙傳佛氏宫民樂耕桑無水旱穹碑猶紀郡侯功嶽鄂王墓在棲霞嶺口葬名將太師忠武鄂王嶽飛于此將軍魂夢繞旌旃偃月謀成尚忍言一旦風波誰左袒八陵荆棘自中原更無鴈帶邉頭信惟有天知地下寃鬱鬱棲霞霞外樹墓門不掩雀巢喧和韻精忠賜字繡旌旃净掃邊廷有誓言大將一朝身竟殞權奸千古罪難原鳥填東海那消恨鵑呌南枝若訴寃四季棲霞嶺邊路邦人祭奠鼓聲喧棲霞洞在棲霞嶺頂妙智菴東其地多石厥土剛燥嵗剜日鑿倚空如懸咸淳中洞外為亭二曰暢亭曰瀹俗此洞近時編入圖經梵庵雲隔洞髙虛傍路隂森樹幾株石室跨空山骨碎林風掠地土痕枯兩亭瀹俗秋偏暢六月披襟暑欲無如此巖墻難此立有人編入職方圖和韻誰搆雙亭倚碧虛繞庵緑樹幾多株洞門炎夏寒猶在石眼清泉旱不枯客至一襟凉思爽地偏半㸃俗塵無世間若有王摩詰來此須應寫畫圖九里松在一字門裏舊名袁公松門唐開元間刺史袁仁敬夾道種松錢塘吳說書九里松三字揭之紹興中思陵幸天竺回易以奎扁終不稱聖意㫖令金填說書重揭之至今尚存開元刺史擅清風九里親栽夾道松屋頂自生濤浪勢根頭誰覔茯苓蹤行春橋掩雲千態一字門封翠幾重人訝金填吳說筆不知此筆遇髙宗和韻刺史袁君有古風沿湖九里植蒼松凉颸度處琴調韻積雪晴時屐印蹤一路波濤聲洶洶兩行幢蓋影重重森然總是徂徠種想與秦封不共宗玉泉在淨空院內齊建元中靈悟大師曇超卓庵演法於錢塘靈苑山龍君逺來聽法又為撫掌出泉砌以方池畜大金魚有景定間周棟記南齊事蹟已銷沉曾立苔碑記古今一老出泉猶撫掌此僧演法欲傳心樹頭龍過家家雨池面魚遊尾尾金行客不須閒照影要知澤物溥春霖和韻說法禪翁跡已沉靈源一𣲖顯于今遊人來洗塵凡耳衲子坐澄清净心泉噴池中皆白玉魚遊水底盡黃金龍君香火相傳久大旱應須去作霖鮑家田在東山弄北田中多種白蓮利溥于稻吳越相鮑君福賜田錢塘至今名焉有玉泉水流出灌溉弄轉東山憶故錢錢家曾賜鮑家田地名有自誰能考相業無聞姓却傳種藕户繁招宿鷺尋花人倦信啼鵑玉泉流䕃分西去併入官塘漾野船和韻一畝膏腴直幾錢人稱此處總良田靈泉昔為龍君出沃壤今因鮑相傳野水平橋初過雨落花滿地正啼鵑秋成早晚皆收穫䆉稏穰穰載滿船忠勇廟在九里松行春橋西前軍統制張玘紹興末從張子蓋解海州圍玘戰沒贈承宣使建廟海州及本軍門首賜諡忠勇才接軍符便起程此行要並鐵山名孤忠解得孤城急一勇判來一死輕堂屋依湖空栁色廟門當路枕松聲丈夫要著褒榮典誓挽天河洗甲兵和韻誓掃胸奴不計程將軍忠勇素知名一心要解圍城急百戰寧知性命輕古木秋風荒草色空山夜月慘猿聲隂氛消豁英雄死從此朝廷怯用兵左軍教場墓在行春橋水竹塢內俗呼馬三寶墓紹興末增廣教場此塜獨髙大衆欲去之方舉鍤間有黑蜂數百飛出不可向是夜戎帥夢一髙冠朱衣曰吾錢王之子葬此已久祈勿毁方怪之詰朝得墓軍中遂留此墓演武場頭傍古松精魂驚起廢墻東黑蜂飛毒歸鉏下白骨通靈入夢中樵牧地寬千騎勇鼓鼙聲撼一山空若錢若馬訛傳久難覔埋銘證異同和韻一灣流水數株松舊塜巋然廢苑東枯胔恐拋蓁棘裏精靈默感夢魂中黑蜂散去荒丘在白鶴歸來故苑空此地久無人閲武寒鴉古木景長同靈隱天竺寺門在飛來峰牌門東俗呼二寺門又名方外門慶歷八年太常博士元居中書扁知杭州袁韶立至今不易畫棟朱簷暴虎蹲亂鐘穿翠掩朝昏去來所得無多衲覺悟何曾有二門山鳥山花應自若佛心佛法與誰論風埃幾換行人鬢博士元公扁却存和韻小朵峯如虎豹蹲上方鐘磬報晨昏諸僧㑹供過千鉢四寺殊宗共一門靈徹詩工今鮮比曹溪𣲖逺近誰論元君大字真遒徑尚有飛來舊扁存合澗橋在飛來峯路口靈山隂北澗陽即靈隱寺靈山南南澗陽即天竺寺二澗流水號錢源水繞寺峯南北而下至峯前合為一澗危闌壓定活流重誰識錢源繞梵宫兩澗共歸橋底合萬雷莫敵水聲雄遊人移步心還恐野衲棲禪耳欲聾石倚卧梁山月落白猿一嘯五峯空和韻緑樹層層怪石重東西澗繞梵王宫橋間流過雙溪合雨後聲喧萬鼓雄遊客喜聞成久立老禪無聽似真聾碧䦨我昔曾來倚俗纍都教一洗空北髙峯在靈隱寺後山唐天寶中建磚塔七層㑹昌中毁大中復興至錢氏重修至道二年雷火爇淳化後屢修元豐中重建咸淳七年燬減作五層幡竿裊影入青冥暮鼓朝鐘鎮不停劫火幾灰龕底像西風兩減塔層鈴市人祈福心苖異廟祝求金口角靈三十六彎登絶頂日中長現七元星和韻千層翠聳入冥冥雲合雲開不暫停前代捨資營石塔下方仰面聽金鈴客躋絶頂何辭倦人叩叢祠為乞靈老衲燃燈當靜夜分明移下半天星韜光菴在法安院後韜光禪師不知姓名唐代宗朝出蜀師囑曰遇天可前逄巢即止此山名巢溝塢值樂天守杭遂隱焉樂天招以詩師有難教下碧天之答遂與為友樂天歸洛後示寂香山庵悟得師禪隱此林謾傳難下碧天吟巢溝塢上人無迹雲月堂前梅有隂家棄蜀鄉年嵗逺身濳洛寺屋廬深死生印得香山去可遂西來一片心和韻開士庵藏寶樹林白公來訪費清吟桂花茶煮雙松下貝葉書翻萬竹隂飛鶴影橫山月小啼猿聲度嶺雲深昔曽與客躋攀到到此都忘富貴心西湖百詠卷上
