花移根良難獨存園門外尋亦枯矣咸淳間建宗陽宫移拆入城翠挹南山樹石蒼五花亭外萬花芳雲芝栱斗晴簷濕金字屏風水榭涼柳接蘇堤無空地萍侵蘭栧有深坊未幾移築仙宫邃一本紅查委路傍和韻地接屏山山色蒼海查一樹尚芬芳百花爛漫春光好萬竹陰森暑月涼細草近連仙客館垂楊低覆御船坊年來此境荒蕪甚遺老經過嘆道傍甘園在净慈寺側齊宫之西舊為甘內侍園淳祐中名湖曲園咸淳中屬謝府名新園園倚雷峯有四面堂淳祐郡守所創堂下接翠芳園船坊內官園邃傍齊宫楊柳堤南翠幾重四面堂虛凌上界五層塔近壓中峯徑連湖水行幽草廊接風亭卧偃松鄰岸御舟空望幸深坊長日鎖飛龍和韻甘氏名園近舊宫東風花綻路重重聲鏘環珮風前竹翠結芙蓉雨後峯池內已無魚躍藻塔邊猶有鶴巢松當年中貴今安在應向橋山從六龍雷峯在顯嚴院開寶中錢氏妃建塔院院側有雷峯庵郡人雷就故屋塔記始以千尺十三層為率事力未充姑營七級此山出黃皮木世訛黃皮塔衆山環繞故名中峯林和靖有中峯行樂詩慶元元年庵院始合為一今止五級或因風水相壓減去今地基廣袤塔身矮肥往來圗畫者欲著相不能不疑此地名塔弄五級浮屠透泬寥黃皮園上梵坊遙當時雷就家曾棄前代皇妃迹已銷鈴帶水風傳古弄燈分山月照長橋根基自廣雲層減擁腫難供畫筆描和韻古塔湖邊久寂寥碑刋嵗月亦云遙風來鈴鐸何曾響雨剝青紅已盡銷晝見簷陰飛野鴿夜無燈影落溪橋畫師欲寫西湖景此境還須用意描勝景園在雷峯路口東開禧間韓托胄園陸放翁作南園記韓逰村莊曰惜無犬吠隨有效之者韓敗園屬官名慶樂園淳祐中撥賜嗣榮王易今名名花嫋嫋草纎纎臺榭隨幽逐勝添十樣結亭環水樹一碑述記卧風簷梅關橋落停􅗚鑰射圃樓空失垜簾向日相傳誰學吠村莊畢竟出沽帘和韻春來芳草緑纎纎亭榭園中比舊添芍藥日烘迷綵檻芭蕉風動拂雕簷花邊碧沼堪垂釣竹外青山稱捲簾悮國平章何處也東風還揚酒家帘長橋在勝景園及净慈寺東跨水甚長有亭甚壯麗日填月塞皆民居矣橋西有寺南對鳳凰山又有澄水閘東抵清波門橋此最短而長名自若南港虛明架石梁寺樓鐘鼓幾斜陽相傳亭跨危基壯誰見橋橫古道長澄水閘荒沙草碧清波門近市塵黃鳳凰山在闌干外玉抹烟屏鷺一行和韻前朝疊石架為梁影落清波幾夕陽世事如今雖已改橋名依舊尚稱長岸頭雨過山逾碧䦨畔秋深柳半黃曾策吟笻閒倚處汀洲飛起雁行行劉妃墓在方家峪鳳凰山下褒親崇夀院後紹興中思陵敕葬妃子于此佛廬增耀石人眠莫謂思陵雨露偏寵斷自空蝴蝶夢魂歸猶咽鳳凰泉碑砆蝕翠埋荒土樓拱塗丹落廢磚主祭有誰今若此此時出色想無氊和韻烟草萋迷石獸眠生前應沐寵恩偏芳魂寂寂依何處幽魄沈沈閟夜泉水鳥競巢神路柏雨苔深翳饗堂磚一杯誰奠清明酒只有楊花鋪白氊慈雲嶺在方家峪西南嶺下為郊臺嶺頂可望江湖石上刻後唐篆字云梁單閼之歲興建龍山至涒灘之歲開慈雲嶺至今尚存疊疊流雲步步苔九霄紫氣限蓬萊後唐刻石初開路南宋郊天别築臺慰眼江湖空嵗月傷心陵寢墮塵埃桃花爭趂春風老又引逰人一度來和韻行躋石磴躡春苔南宋遺基但草萊開路尚存前代碣拜郊還有舊時臺東瞻巨海茫茫浪北望中原滚滚埃最是令人凝睇久胥濤遙駕雪山來包家山在慈雲嶺南冷水峪多桃花名桃花關關門上揭蒸霞二字郊壇在山之西藉田園在山之南綺霞蒸日透林梢一簇南山尚姓包冷水峪邊苔色老沖雲樓下樹陰髙園鄰古道傳耕藉臺倚青城想拜郊欲趂桃花尋隱去關門無鑰不須敲和韻桃花滿眼錦攢梢春色疑將山色包爛漫正憐千樹合岧嶤還露一峯髙詩人著屐閒躋嶺逰客看花競出郊亦有招提在烟谷數聲清磬隔雲敲登雲臺在天真院山上後梁龍德中錢氏建臺名登雲又名錢氏郊臺臺側有靈化洞錢武肅就石刻碑吳越山川幾落暉登臨轉步入雲扉寺名曾侈天真錫碑字空傳武肅揮靈洞土埋攢棘掩古臺石落借松圍龍旗鸞輅曾遮擁肅祀圎丘慶六飛和韻古苔衰草幾斜暉臺下人家白板扉舊刻已看蒼蘚沒新詩聊把彩毫揮迢迢颷馭三山去寂寂雲山四面圍來此登臨慨吳越歸鴉還帶夕陽飛五丈觀音在勝相院內唐開成中建錢氏時有西竺僧轉智附海舶歸風鳴浪湧智誦如意輪咒見如意珠王相高十丈風息得濟智遂與僧光改千佛寺閣立五丈之像二合為十丈以答佛施建炎兵燬止存五丈觀音俗傳人有意度則求轉智者以此也乾道中光堯聖子神孫臨幸有程泌記海國風濤擁萬尋此軀何翅直千金涉波直現昻藏相結屋還堅報施心圗得諸方傳轉智幸存一半有觀音陰廊誰立苔碑在只載三朝法駕臨和韻大士空中現幾尋莊嚴寧惜費千金若非突兀驚人相那顯慈悲救苦心風度遙傳鍾磬響月明逺聽海潮音殘碑尚在荒山裏鳳駕鸞旗不再臨表忠觀在龍山南熙寧中趙清獻公奏請以錢氏墳廟于此建觀俾諸孫為道士曰自然者居之嵗度其徒賜額表忠詳載東坡所撰碑紹興至寶祐前後屢增葺咸淳中觀廟合為一錢子欣然著羽衣何須學賦鑑湖詩帝俞清獻垂情疏人讀文忠叙事碑五廟衮圭榮祖節千年香火托孫枝雲林閣上西風起吹落龍山宰樹悲和韻曾聞大樹錦為衣惆悵如今為賦詩鐵劵千年吳越裔記文百世長公碑香燈寂寞存遺址松柏荒涼減舊枝惟有年年春色暮啼鵑空向月中悲聚景園在清波門外阜陵致養北宫拓圃西湖之東斥浮屠之廬九曾經四朝臨幸繼以諌官陳言出郊之令遂絶園今蕪圮惟柳浪橋花光亭存鑾鈴遺響輦遺踪萬景曾經聚此中寺宇有名基址散君王無逸宴逰空橋昏柳浪龍舟雨亭冷花光雉扇風臺沼已無春又老萬年枝上夕陽紅和韻聚景依稀有舊踪阜陵曾養此園中花光柳浪名還在鳳輦霓旌事已空金井梧桐愁夜雨碧欄芍藥怨春風如今倚杖閒回首霜葉離離映水紅崔府君廟在顯應觀內東漢崔子玉也傳為磁州府君紹興中建靖康間思陵使至磁州神馬引而南建炎初秀王夫人夢府君擁一羊曰以此為識遂育阜陵嘉定間樓鑰奉詔撰碑述神靈甚詳且謂史失其名非崔子玉也靈休逺被衛行都宿有元勛夢又符引馬擁羊昭景貺立碑建廟述嘉謨九陵荆棘年空往十里笙歌景不殊莫倚西齊闌檻去斜陽無語滿錢湖和韻東漢明神護宋都深宫曾有夢相符試看殁後昭靈貺定是生前著顯謨金石文章千古在江山景物四時殊忽聞闌外鳴簫鼓畫舫何人去泛湖依光堂在崇福寺內太平興國元年建寺本錢氏故苑芝生其間遂建寺號靈芝大中祥符賜崇福額紹煕中阜陵臨幸御小車至齊堂飯僧面湖創堂扁曰依光中設御座塵凝黼座憶垂衣今古湖波錦四圍靈育紫芝三秀逺光開緑玉片金輝松窗自掩空蓮社石榻相期卧柳枝半捲珠簾看落景笙歌長送畫船歸和韻禪老身披舊衲衣寺前山色翠成圍只因曽沐君王幸從此長依日月輝苑內舊生三秀草堂前春長萬年枝鑾輿一去無消息唯見烟林夕鳥歸西湖百詠卷下
