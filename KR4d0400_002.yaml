body:
  text: 西湖百詠卷下宋董嗣杲撰明陳贄和石筍峰在韜光菴西普圓院後西北一峰嶄然特立髙數十丈相傳以筍名之異種休參玉版禪嶄然一角立層巔逺尖自抱雲根壯疊蘚誰疑雨籜纒夢裏三生空過眼胸中千畝謾流涎此龍難入寧僧譜出土摩霄是幾年和韻昔聞玉版妙參禪如筍尖峯聳碧巔雨過似將斑籜洗苔封猶訝錦䙀纒故知坡老胸無礙却怪饞師口抹涎底事不抽枝與葉森然成竹是何年西溪在靈隱寺山背居人能力其勞漁樵耕牧各遂其業楊蟠詩云為愛西溪好長憂溪水窮山源春更落散入野田中漁樵耕牧自成村就屋編籬古意存出塢野雲多曲折過橋溪水半清渾一逢白壁書香社幾見朱䦨障墓門地利最饒人事簡山家還有别乾坤和韻西溪曲曲繞西村民業農桑禮意存數朵閒雲山入畫一畨驟雨水流渾緑蘿葉密遮茅屋紅杏花開映蓽門不與桃源風景異彼乾坤即此乾坤飛來峰在靈隱寺前晉咸和元年西天竺僧慧理登兹山嘆曰此是中天竺國靈鷲山之小嶺不知何年飛來因止錫建寺山之靈隱兆於陶唐時飛來之說傳於咸和年間理公著腳五峰前樹石蒼浮滴翠涎因指何年飛到此曽棲中竺悟來禪一猿可驗為靈鷲萬古無言有冷泉今日共知遺跡勝隱名却有許由傳和韻正當靈隱寺門前深洞濳龍或吐涎曽有黃猿閒獻果何妨緇侣靜安禪石間髙聳無名樹山足長流不息泉天竺鷲峰分小朵逺飛來此異僧傳冷泉亭在飛來峰下唐右司元􅀢建刺史白居易撰記按古志靈隱澗古許由嘗飲于此盧同父詩云問山何以名靈隱山曰當年隱許由小朵峰前玉鏡寒幾回倚杖聽潺湲箕公飲澗非凡水慧理呼猿是此山亭角靜依金剎古樹身凉卧石䦨閒無因可洗人間熱時御清風照影還和韻一勺嘗來氷齒寒亭前終日響潺湲靈源㵼出穿西澗别𣲖分來繞北山飲水黃猿携子至窺魚白鷺比僧閒詩翁欲試先春味碧甕呼童逺汲還呼猿洞在飛來峰之中僧慧理曽呼猿於此名呼猿洞楊蟠詩作呼猿澗小隱靈山莫計年此猿清嘯洞門前當時不有胡僧唤今日應無野迹傳寒挂枯條申右臂晚藏碧樹憶西天雲巖烟谷多遺種月下三聲醒客眠和韻洞號呼猿不計年引兒來飲碧溪前當初曾聽胡僧唤今日留為故事傳白晝深藏雲滿樹清宵長嘯月當天一聲啼過喬松頂驚起巢間老鶴眠龍泓洞在靈鷲院理公岩北赤烏二年葛翁於此得道輿地志云有洞徹浙江下通蕭山採石乳者入洞聞波浪聲葛翁行滿赤烏年丹竈離披已絶煙龍在此泓誰得見路通别邑自相傳樹頭雷兩遺神火岩腹莓苔帶海涎有耳不須聞浪湧只消采乳亦通仙和韻葛令冲升是幾年舊棲虛掩薜蘿烟雲邊鶴馭難重見岩下龍泓自昔傳誰入重淵聞激浪孰云深洞有遺涎西湖不與丹丘異何用乘風逺慕仙理公嵒在靈鷲院方丈後晉僧慧理偃息之地嵒下通人往來淳祐中主僧行果始作閣道以祠慧理西來識得此雲根終此雲根護法門由晉尚傳斯語在到今休想舊嵒存天開教觀香燈盛人仰胡僧相貌尊行果芟教荆棘盡分明隻手破沉昏和韻蘿龕曽結傍山根聞有於莵為守門施食臺荒花自落翻經人去石猶存雲遮湖上山千疊月照嵒中像一尊鄰寺今餘幾僧在數聲清磬送黃昏香林在下天竺後塔西日月嵒左舊名香林洞又名香桂林今直扁香林日月岩頭古翠埋錦雲深隔洞門開蒼藤隨石無根活靈杞何年有種栽氣裊野烟疑麝過暖熏山雨誤蜂來空亭誰領幽芬坐雲鶴同行損緑苔和韻自昔靈根月窟埋移從人世賸花開未將白玉堂前種却向黃金界上栽月照千株清影動風傳萬斛異香來少年攀桂今衰老䇿杖重尋步翠苔翻經臺在下天竺香林門道裏謝靈運與僧於此將北本涅槃經翻為南本三十七卷舊有七葉堂過門跬步入香林七葉遺隂地尚靈曽借東山康樂手共翻北本涅槃經䦨腰葉擁空臺赤石罅泉通逺筧青雲掩蓮花峰下座若人演義若人聽和韻昔聞康樂訪祗林玩水登山豁性靈樂道遍窮三教㫖與僧同譯幾函經舊臺猶在雲常護行徑無踪草自青想見當年鳴梵唄老猿應向月中聽重榮檜在下竺懴堂後相傳隋代所植後為兵火延燎至大中祥符間復茂盛或謂遵式懴主灑水誦呪故重活一株蒼檜卧龍身受得隋朝雨露深地下仙根將換骨人間劫火不燒心死條節節蕃春信生意枝枝蓊翠隂此木豈知魂可返爭傳呪水出叢林和韻恐是濳蛟變化身風霜飽歷嵗華深當初枯槁寧非數今日重榮豈有心雨過童童擎翠蓋日長鬱鬱布濃隂不知隋代何人植得接金仙寶樹林鍊丹井在下竺西廊下葛仙翁有丹在井井水可以療病稚川曽此倒靈瓢䦨上銀牀壓甃腰丹氣騰空知幾轉神光射屋起中宵有茶可品春煎細何疾能治曉汲遙萬古仙踪應不泯轆轤聲落病僧寮和韻葛翁昔此汲仙瓢藥滿葫蘆繫在腰鍊得丹成非一日不知羽化是何宵青山人去烟霞祕碧甃苔荒嵗月遙緇侣㪺嘗消宿恙時聞僧梵出禪寮跳珠軒在下竺知客寮中東坡和周次元激水云道眼轉丹青常於寂處鳴早知雨是水不作兩般聲溪流穩信竹龍驅聲激清虛入耳孤此竅可消諸念妄一丸長躍半空珠挂瓢舀水應知味就壁龕碑不用砆誰謂佛靈占有驗殆於兒戲果何殊和韻終朝城市厭馳驅來探靈源興不孤雨後琮琤如潄玉月中的皪似跳珠支郎經室苔生砌坡老詩碑草沒砆煮茗有僧能别味此泉不與惠山殊曲水亭在下竺寺前一曰流杯亭有水臺盤在亭心端平中風水拔木亭仆淳祐間重建遵式立陸羽二寺記碑尚存竹色松隂翠浪浮春風吹落澗聲幽古亭當路空凉影溪水循盤散漫流繭紙叙詩年幾換羽觴傳酒禊重修晴嵐四掩鳴琴杳如在稽山道上遊和韻片片飛來水面浮隂隂竹樹景偏幽酒斟杯裏循環轉泉繞亭心曲折流昔日右軍名獨盛如今禊事孰能修顧豫白髮歸田客賴有詩篇紀勝遊天竺觀音在上天竺寺石晉天福中僧道翊見山間光明得香木命匠者孔仁謙刻觀音像建看經院錢俶夢白衣求治其居歷代增廣加厚田業錫賚闕器至今雨暘隨禱即應木異難儕衆木淹刻成慈相孔仁謙真珠瓔珞鴛鴦殿白玉屏風翡翠簾晴雨禱祈隨感召香燈熾盛極莊嚴鎮山寶聚田廬廣靈貺彌彰一百籖和韻上竺來逰竟日淹南能留客禮尤謙香雕端妙龕中相珠結玲瓏殿內簾士庶乞靈咸敬禮神天護法極威嚴少年早有青雲志求得觀音第一籖風篁嶺在放馬場闕路通龍井元豐中辨才法師元净淬治修篁因以名嶺東坡訪之送至嶺上坡曰逺公復過虎溪矣辨才笑曰子美不云乎與子成二老來往亦風流橫陳翠葆列烟屏聨步蒼林想典刑二老相分龍井嶺一時如過虎溪亭風吹貼石叢篁碧雨剝題名暈蘚青更有澗流朝暮落此聲不厭客來聽和韻萬玉森森映翠屏來逰還想舊儀刑謾傳惠逺成三笑宜與東坡創一亭風篠不時聲摵摵雲山終古色青青行人倦就蒼隂坐滿耳蕭颼最可聽龍井在風篁嶺上本名龍泓吳赤烏中葛翁鍊丹于此故老相傳井與海通其水隨潮候長落腥攢石縫瀑花多還有龍神蟄此窠通海淺深山不語隨潮長落水無波謾傳方士遺丹在不奈潜鱗吐霧何時雨愆期無驗處幾畨雷火爇松柯和韻嶺有深泓積蘚多濳龍於此作深窠流傳有脉濳通海消長隨潮暗湧波山客煉丹名尚在居民望雨事如何喬松偃蹇千年物底事雷神伐翠柯辨才塔在龍井演福院潮音堂西元豐中辨才自上竺退休此山燕居十年後示寂東坡致祭有文囑頴濵撰塔銘瀾翻八十一年空爭訝前身是井龍心靜巳成無上智學知今復有誰宗雲生遺塔封慈相雨濺冲泉雜定鐘幾字碑隂坡老筆聲闕想得舊逰從和韻隻履西歸世相空鉢中無復有降龍談禪深究三乘義面壁還歸一指宗山畔苔荒秋雨榻林間風送夕陽鐘東坡門下多名士外教當初亦景從梅坡園在小麥嶺北龍井路口旌德顯慶寺西恭聖仁烈楊太后宅園墻擁雙扉鎖錦窩溪聲不敵樹聲多誰家種麥曾名嶺今日尋梅且陟坡萬厦棟梁巢燕雀四山風日養松蘿園丁自飽栽花利月給楊家得幾何和韻花成錦繡草成窩自古名園富貴多直把金錢堆作埒寧論瑪瑙砌成坡瓠瓜嫋嫋緣青蔓松柏垂垂綰翠蘿麥嶺北邉龍井口荒凉今日竟如何長耳相在法相院石晉天福中泉南長耳和尚行修真身在焉有碑載修為定光佛後身修平日募人作福或問之曰能遮百醜眉目如生骨骼寒後來曾紀短碑頑雙垂長耳過肩角千古遺軀落世間覆履有方隨迹滅守龕無語向僧閒想知自醜難遮斷兩扇禪扉及早關和韻不畏炎蒸不畏寒幻軀留得化冥頑神歸兜率天宫裏形住閻浮世界間耳嚲及肩雖說異口長無語一何閒春光老盡遊人少寂寂松扉盡日關玉岑與慧因寺門相對此山木潤或傳山出玉許采大書兩字刻石上少遊夜過龍井濯足於慧因澗即此也雲掩風林萬竅號慧因橋畔息方袍秦郎閒濯溪頭足許老清揮石上毫玉出何年迷草莽教傳異域想波濤山門翠擁山嵐潤一道光芒月正髙和韻登臨忽聽嶺猿號嵐靄霏霏濕翠袍傍澗汲泉烹鳳髓磨崖題句運狸毫謾傳玉氣浮清夜時聽松聲響怒濤歸上舵樓回望處瓊瑶簪聳碧雲髙南髙峯塔在烟霞山頂天福中建崇寧中僧修懿修乾道中道者義圎重建淳祐中賜榮國院額闕後石穴祈雨嘗驗草庵在張帝殿下塔西有捨身臺石誰舍塵身石骨巔浮屠突兀拂霄躔方隅端拱明離位梯級髙營石晉年土穴有龍噓重霧草庵無衲坐空禪虛危直視烟霞路鏜鞳風鈴到處傳和韻碧嶂髙侵碧漢巔岧嶤疑逼斗牛躔山中衲子寧愁老峯頂浮屠不記年危磴雨晴難著屐深嵒月照稱棲禪逰人初到西湖者欲倩丹青作畫傳烟霞洞在清修院內石晉開運中僧彌洪遇異人指有羅漢六尊錢氏遂刻十二尊足之洞傍有象鼻峯佛手嵒萬色無如疊翠何何僧鐫像屹嵳峩山屏晴掩牌門杳風鑰陰封梵屋多象落鼻形懸洞右佛垂手跡寄岩阿燈輝金碧琉璃碗暗掩僧房絡薜蘿和韻為問烟霞景若何洞前山接翠嵳峩峯垂象鼻形尤怪石刻神僧數更多梵唄尋常鳴月下禪龕重疊傍岩阿誰鐫白玉如來手風動渾疑挽緑蘿石佛庵在烟霞嶺東南髙峯路口後周廣順中有行腳僧影貼石而行移時不見人遂刻其像又刻佛像于石此庵頭陀世守香火有修街石碑存南峯雲墮屋梁危異蹟曾遺廣順時行腳影留嵒石古頭陀老守草庵欹幾年香火傳朝晚萬谷烟霞闕半掩風扉鐘又響風霜皴盡砌街碑和韻松蘿屋外挂猿危正是禪翁定起時石上異僧誰獨見山頭層塔並無欹橋通麯院深遮柳路入梅闕别有闕鐫佛甃街功蹟著前人文字紀荒碑水樂洞在烟霞路口開運中錢氏建名西關净化院有洞深窈水聲如擊金石熙寧中杭守鄭獬名水樂洞淳熙中內侍李隸請額重建佛宇增廣園池嘉泰中改賜楊郡王歷年既久水聲絶響賈府得之舊觀復還築園裹寺接山椒如此經營豈一朝兩洞倚雲空鎖鑰亂泉激雨想簫韶樹埋院落關門邃石罨亭臺棧路遙白髮聾僧扶舊額金蓮又長玉淵苗和韻洞邊有樹結紅椒洞裏泉鳴暮復朝雨後依稀如擊磬月中倣佛似聞韶山僧下汲還愁暗詩客來聽不憚遙縱使農家逢大旱也難分去溉嘉苗楊梅塢在石屋西瑞峯塢內有老嫗金姓地栽楊梅品味極佳俗呼金婆楊梅仙子遺丹滿瑞峯纍纍疑與荔枝同金婆傳種移根異火齊燒空滿塢紅鶴頂分丸凝曉露猩唇結顆綴薰風曩時若解包茆貢一騎星馳入漢宫和韻楊梅千樹繞西峯色與炎州荔子同火齊纍纍盈塢赤靈丹奕奕照林紅客嘗紫顆如甘露鳥啄朱丸墮晚風味比櫻桃尤覺美正宜貢入大明宫石屋在大仁院內