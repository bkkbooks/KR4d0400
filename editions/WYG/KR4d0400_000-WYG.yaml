body:
  text: 西湖百詠目録别集類三宋巻上豐樂樓湧金池環碧園玉蓮堂玉壺園先得樓古枊林雲洞園霍山祠湧泉東西馬塍石函橋孤山路徳生堂總宜園斷橋大佛頭葛嶺保叔塔巾子山水月園水仙廟寒泉參寥泉葛公雙井江湖偉觀此君軒杯泉初陽臺孤山和靖先生墓陳朝柏瑪瑙坡金沙井六一泉西林橋鳥巢樂天竹閣岳鄂王墓棲霞洞九里松玉泉鮑家田忠勇廟左軍教塲墓靈隠天竺寺門合澗橋北髙峯韜光庵巻下石筍峯西溪飛来峯冷泉亭呼猿洞龍泓洞理公嵒香林翻經臺重榮檜煉丹井跳珠軒曲水亭天竺觀音風篁嶺龍井辨才塔梅坡園長耳相玉岑南髙峯塔烟霞洞石佛庵水樂洞楊梅塢石屋真珠泉虎跑泉南屏山蘇公堤先賢祠西湖道院湖山堂三賢祠雪江講堂崇真道院小新堤翠芳園甘園雷峯勝景園長橋劉妃墓慈雲嶺包家山登雲臺五丈觀音表忠觀聚景園崔府君廟依光堂臣等謹案西湖百詠二巻宋董嗣杲撰明陳贄和韻嗣杲字明徳號静傳居士錢塘人宋季入道孤山四聖觀改名思學字無益故西湖志稱為道士然據此集自序稱咸淳間薄宦於霅則固嘗登仕版也贄字維成餘姚人徙於錢塘洪武間以薦授杭州學訓導後官至太常寺卿西湖志稱嗣杲原唱及贄所和皆九十六首天順癸未錢塘人南康知府陳敏政始以二家所作合刻又載嘉靖丁酉周藩南陵王雲樓子重刻其序亦稱董唱居前陳和居後仍各九十六首共一百九十二首謂之百詠者葢亦極言之耳云云此本上巻四十九題下巻五十一題實各足百詠之數與西湖志所記不符疑周藩翻雕之時其底本偶有脱頁未及詳考遂以為原缺四首田汝成修西湖志時又僅見周藩之序遂據以筆之於書耳其詩皆七言律體每題之下各注其始末甚悉頗有宋末軼聞為諸書所未載者嗣杲詩格頗工整贄所和才力稍弱亦足肩隨其詩皆迥在許尚華亭百詠之上也乾隆四十三年八月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀西湖百詠原序錢塘西湖為東南偉觀窮騷人墨客技不得盡元祐間楊郭二子皆以百絶唱乃無嗣音者兩山僊佛盤錯坡老守郡時逰歴幾徧遺跡尚可考南渡後貴臣邸第多在亭館日闢視前此復不侔盖富盛極矣予長兹地與山水為忘年交凡足跡所到命為題賦以唐律幾二十餘年僅逮百首然皆目得意寓敘實抒冩非但如楊郭二子披圗按志想像髙唐而巳捜索竒勝難徧以數舉此直據予所見不以誇竒鬬勝為工也薄宦于霅公事簡輙是正完恐故老傳說誠偽不儗將有以蝦蟆方言指下馬陵者或將笑之予狀景物耳不暇恤嵗月無情陵谷易變將使百千年後登覽降望於西湖上者因詩有感焉咸淳壬申臘月静傳居士董嗣杲書于餘英堂
